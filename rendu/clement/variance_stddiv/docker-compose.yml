services:
  app1:
    build: .
    environment:
      REDIS_HOST: redis
      ILIAN_MOYENNE_FILE: /app/ilian.py
    volumes:
      - ../../ilian.py:/app/ilian.py:ro
    depends_on:
      - redis
    networks:
      - backend

  app2:
    build: .
    environment:
      REDIS_HOST: redis
      ILIAN_MOYENNE_FILE: /app/ilian.py
    volumes:
      - ../../ilian.py:/app/ilian.py:ro
    depends_on:
      - redis
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - backend
      - edge

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - backend
      - observability

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - observability

networks:
  edge:
  backend:
    internal: true
  observability:
    internal: true

volumes:
  redis-data:
